name: Storybook → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize gh-pages writes across this workflow AND ci.yml's
# `pr-screenshots` job — both push to the same branch and would otherwise
# step on each other's force-push.
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  # peaceiris/actions-gh-pages uses GITHUB_TOKEN to push to the gh-pages
  # branch; `contents: write` is enough — no Pages-API perms needed
  # because the site is served from the branch, not from a workflow
  # artifact.
  contents: write

jobs:
  publish:
    name: build + publish storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve build scripts
        run: pnpm approve-builds --all
        continue-on-error: true

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Publish to gh-pages
        # `keep_files: true` preserves the `pr-<n>/` subdirectories that
        # ci.yml's `pr-screenshots` job writes — without it, every
        # storybook deploy would wipe the open PRs' screenshot copies.
        # The CNAME stays pinned so the custom domain (doc.pert.li)
        # survives both push paths.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          keep_files: true
          cname: doc.pert.li
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "storybook: deploy ${{ github.sha }}"
