name: CI

on:
  # PR-only. Every commit on `main` got here via a merged PR that already
  # ran this workflow, so re-running on the merge commit just burns Actions
  # minutes without catching anything new. `docker.yml` still fires on
  # tags, and `storybook.yml` still deploys Pages on main.
  pull_request:
    branches: [main]

# Cancel older runs for the same branch / PR — saves Actions minutes when
# new pushes land while a run is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: check + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build/test rely on these being present (even if dummy) — the
      # Automerge sync server reads DATABASE_URL at import time, and the
      # AI provider abstraction sniffs at least one key.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-not-secret
      ANTHROPIC_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          # The pre-approved build scripts (esbuild, swc, etc.) need to run
          # for native modules; pnpm refuses by default in CI without this.
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vite's pre-bundled deps and Vitest's transform cache live under
      # `node_modules/.vite` and `node_modules/.cache`. They're a function
      # of the lockfile (deps), the build config, and the source — restoring
      # them across runs skips the cold-start dep optimization in both
      # `pnpm test` (vitest's first transform) and `pnpm build`.
      - name: Cache Vite / Vitest deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.cache
          key: ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'vitest.config.ts') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'vitest.config.ts') }}-
            ${{ runner.os }}-vite-

      - name: Approve build scripts
        # pnpm 11 requires explicit approval for postinstall scripts even when
        # listed in pnpm.onlyBuiltDependencies. --all is fine here because
        # the allowlist is already declared in package.json.
        run: pnpm approve-builds --all
        continue-on-error: true

      - name: Biome (lint + format + organizeImports)
        run: pnpm check

      - name: Vitest
        run: pnpm test

      - name: Build
        run: pnpm build

      # The e2e job consumes this artefact instead of running `vite dev`.
      # `.output/server/` is the Nitro production bundle; we ship the entire
      # output (server + public assets) so e2e can serve it via
      # `node .output/server/index.mjs`. ~30 MB; 1-day retention because
      # nothing outside this run needs it.
      - name: Upload built server
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .output
          retention-days: 1
          if-no-files-found: error
          # `.output/` starts with a dot, so upload-artifact@v4 treats the
          # entire tree as hidden and silently skips it without this flag.
          include-hidden-files: true

  db-back-compat:
    # PR-only: confirm the Drizzle schema in this branch doesn't drop any
    # tables / columns that exist on the merge target. Because Cloud Build
    # runs `db:push` before swapping the image, an older revision can still
    # be live when the new schema lands — dropped columns would surface as
    # "column does not exist" errors against the in-flight requests.
    name: db schema backward compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # `git show <base>:src/db/schema.ts` needs the merge base in the
          # local repo; the default shallow fetch only carries HEAD.
          fetch-depth: 0

      - name: Compare schema against ${{ github.base_ref }}
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-db-back-compat.mjs

  docker-build:
    # Runs on every push to main + every PR. The intent is to catch
    # Dockerfile breakage early — the image is built and smoke-tested but
    # NOT pushed; the docker.yml workflow handles publishing on tags.
    # `cache-from: gha` reuses the layer cache populated by tag builds so
    # PR runs stay fast.
    name: docker build (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # `load: true` materialises the image into the local docker
          # daemon so the smoke step below can `docker run` it. This
          # forces a single-arch build (the runner's, linux/amd64) —
          # fine for a PR check; the multi-arch tag build lives in
          # docker.yml.
          load: true
          tags: pert-li:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Booting the image is the only way to catch bugs where the
      # production bundle references a package that isn't in the prod
      # node_modules (e.g. a devDep hoisted into a static import). The
      # build stage can't see those — they fire at `node` module-load.
      - name: Smoke test (boot + probe HTTP)
        env:
          IMAGE: pert-li:pr-${{ github.event.pull_request.number || github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name pert-li-smoke \
            -p 18080:8080 \
            -e BETTER_AUTH_SECRET=ci-only-not-secret-long-enough-- \
            -e ANTHROPIC_API_KEY=ci-placeholder \
            "$IMAGE"

          # PGLite fallback path (no DATABASE_URL): the server needs to
          # init the in-process Postgres + push the Drizzle schema before
          # serving — give it up to 60s.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/privacy 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then echo "ready after ${i}s"; break; fi
            if ! docker ps --filter name=pert-li-smoke --format '{{.Status}}' | grep -q Up; then
              echo "::error::Container crashed during startup"
              docker logs pert-li-smoke 2>&1 | tail -50
              exit 1
            fi
            sleep 1
          done

          # Probe a handful of representative surfaces. /api/auth is a
          # server-handler route (Better Auth catch-all); / is SSR; the
          # rest are static-ish routes. All must respond 200.
          fail=0
          for path in / /privacy /signin /api/auth/get-session; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:18080${path}")
            echo "$path -> HTTP $code"
            [ "$code" = "200" ] || fail=1
          done

          echo "--- container logs ---"
          docker logs pert-li-smoke 2>&1 | tail -30

          docker rm -f pert-li-smoke >/dev/null
          exit "$fail"

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The verify job builds `.output/` and uploads it as the `build-output`
    # artefact. Running e2e against that artefact instead of `vite dev`
    # sidesteps the dev-mode optimizer (which on a cold runner blew past
    # the 120s webServer timeout) and exercises the actual production
    # bundle the deploy will ship.
    needs: verify
    env:
      CI: "true"
      # Playwright seeds the server with E2E_PGLITE=1 (see playwright.config.ts),
      # so an in-process Postgres handles all DB traffic — no real Postgres
      # needed. We still set BETTER_AUTH_SECRET to keep auth happy at load.
      BETTER_AUTH_SECRET: ci-only-not-secret-long-enough--
      ANTHROPIC_API_KEY: ci-placeholder
      # Tells playwright.config.ts to launch `node .output/server/index.mjs`
      # instead of `pnpm exec vite dev`. Without this flag the config falls
      # back to the dev server (used locally for HMR / fast iteration).
      E2E_USE_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve build scripts
        run: pnpm approve-builds --all
        continue-on-error: true

      # The verify job already ran `pnpm build`; reusing that artefact saves
      # ~30s and guarantees the e2e suite runs against the same bytes the
      # deploy will ship.
      - name: Download built server
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .output

      # Cache the Playwright browser binary keyed on the installed version
      # so we only download Chromium when @playwright/test changes.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium (+ system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Playwright tests
        run: pnpm e2e

      # Walk the JSON reporter output and write a markdown summary into
      # the job's GITHUB_STEP_SUMMARY. Runs on success AND failure so
      # passing runs still show per-spec timings + retries in the Actions
      # UI without downloading the HTML report.
      - name: E2E summary → job step summary
        if: always()
        run: node scripts/playwright-summary.mjs playwright-report/results.json >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Upload Playwright report
        # Always upload — passing runs are useful for spot-checking
        # per-test timings and step traces. The HTML report is small
        # enough that 14-day retention costs nothing meaningful.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload test traces
        # Traces are large (screenshots + DOM snapshots per step) so
        # we only keep them when something failed and a human is going
        # to open them.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 14

  storybook:
    name: storybook test-runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # @storybook/test-runner drives stories through Playwright; the
      # individual play functions don't hit the DB or auth, but importing
      # stories transitively pulls modules that read these at load time.
      BETTER_AUTH_SECRET: ci-only-not-secret
      ANTHROPIC_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve build scripts
        run: pnpm approve-builds --all
        continue-on-error: true

      # Same Playwright browser caching strategy as the e2e job — the
      # test-runner uses Playwright under the hood, so we only need
      # Chromium and key the cache on the installed @playwright/test
      # version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium (+ system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # `storybook:ci` boots `storybook dev` on :6006 and runs the test
      # runner against it; concurrently kills the dev server when the
      # runner exits (`-k -s first`).
      - name: Storybook test-runner
        run: pnpm storybook:ci

  # Aggregate gate. Branch protection should require *this* job, not the
  # individual ones — adding a new job only needs editing one `needs:`
  # list, not the repo settings, and a job that legitimately skips on the
  # current event (e.g. db-back-compat on push-to-main) doesn't fail the
  # gate. Passes when every dependency is `success` or `skipped`.
  ci-ready:
    name: CI ready
    if: always()
    runs-on: ubuntu-latest
    needs: [verify, db-back-compat, docker-build, e2e, storybook]
    steps:
      - name: Check dependent jobs
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq .
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
