name: CI

on:
  # PR-only. Every commit on `main` got here via a merged PR that already
  # ran this workflow, so re-running on the merge commit just burns Actions
  # minutes without catching anything new. `docker.yml` still fires on
  # tags, and `storybook.yml` still deploys Pages on main.
  pull_request:
    branches: [main]

# Cancel older runs for the same branch / PR — saves Actions minutes when
# new pushes land while a run is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: check + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build/test rely on these being present (even if dummy) — the
      # Automerge sync server reads DATABASE_URL at import time, and the
      # AI provider abstraction sniffs at least one key.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-not-secret
      ANTHROPIC_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # `scripts/compute-version.mjs` runs `git describe --tags` to derive
        # the build version baked into the bundle. The default shallow
        # checkout has only HEAD, so without full history the version would
        # always fall back to `0.0.0-dev`.
        with:
          fetch-depth: 0

      - name: Resolve APP_VERSION
        id: version
        run: echo "value=$(node scripts/compute-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          # The pre-approved build scripts (esbuild, swc, etc.) need to run
          # for native modules; pnpm refuses by default in CI without this.
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vite's pre-bundled deps and Vitest's transform cache live under
      # `node_modules/.vite` and `node_modules/.cache`. They're a function
      # of the lockfile (deps), the build config, and the source — restoring
      # them across runs skips the cold-start dep optimization in both
      # `pnpm test` (vitest's first transform) and `pnpm build`.
      - name: Cache Vite / Vitest deps
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.vite
            node_modules/.cache
          key: ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'vitest.config.ts') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'vitest.config.ts') }}-
            ${{ runner.os }}-vite-

      - name: Approve build scripts
        # pnpm 11 requires explicit approval for postinstall scripts even when
        # listed in pnpm.onlyBuiltDependencies. --all is fine here because
        # the allowlist is already declared in package.json.
        run: pnpm approve-builds --all
        continue-on-error: true

      - name: Biome (lint + format + organizeImports)
        run: pnpm check

      - name: Vitest
        run: pnpm test

      - name: Build
        env:
          # vite.config.ts → compute-version.mjs prefers this env value over
          # `git describe`, so the artefact e2e consumes matches what the
          # docker-build / docker.yml jobs publish.
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: pnpm build

      # The e2e job consumes this artefact instead of running `vite dev`.
      # `.output/server/` is the Nitro production bundle; we ship the entire
      # output (server + public assets) so e2e can serve it via
      # `node .output/server/index.mjs`. ~30 MB; 1-day retention because
      # nothing outside this run needs it.
      - name: Upload built server
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .output
          retention-days: 1
          if-no-files-found: error
          # `.output/` starts with a dot, so upload-artifact@v4 treats the
          # entire tree as hidden and silently skips it without this flag.
          include-hidden-files: true

  db-back-compat:
    # PR-only: confirm the Drizzle schema in this branch doesn't drop any
    # tables / columns that exist on the merge target. The new container
    # migrates on boot before it starts serving, so during a rollout the
    # old revision keeps taking traffic against the freshly-migrated DB —
    # dropped columns would surface as "column does not exist" errors
    # against the in-flight requests.
    name: db schema backward compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `git show <base>:src/db/schema.ts` needs the merge base in the
          # local repo; the default shallow fetch only carries HEAD.
          fetch-depth: 0

      - name: Compare schema against ${{ github.base_ref }}
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-db-back-compat.mjs

  docker-build:
    # Runs on every push to main + every PR. The intent is to catch
    # Dockerfile breakage early — the image is built and smoke-tested but
    # NOT pushed; the docker.yml workflow handles publishing on tags.
    # `cache-from: gha` reuses the layer cache populated by tag builds so
    # PR runs stay fast.
    name: docker build (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # `git describe --tags` (resolved below) needs full history; default
        # shallow clone has only HEAD.
        with:
          fetch-depth: 0

      - name: Resolve APP_VERSION
        id: version
        run: echo "value=$(node scripts/compute-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # `load: true` materialises the image into the local docker
          # daemon so the smoke step below can `docker run` it. This
          # forces a single-arch build (the runner's, linux/amd64) —
          # fine for a PR check; the multi-arch tag build lives in
          # docker.yml.
          load: true
          tags: pert-li:pr-${{ github.event.pull_request.number || github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Booting the image is the only way to catch bugs where the
      # production bundle references a package that isn't in the prod
      # node_modules (e.g. a devDep hoisted into a static import). The
      # build stage can't see those — they fire at `node` module-load.
      - name: Smoke test (boot + probe HTTP)
        env:
          IMAGE: pert-li:pr-${{ github.event.pull_request.number || github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name pert-li-smoke \
            -p 18080:8080 \
            -e BETTER_AUTH_SECRET=ci-only-not-secret-long-enough-- \
            -e ANTHROPIC_API_KEY=ci-placeholder \
            -e ALLOW_CONSOLE_EMAIL_IN_PROD=1 \
            "$IMAGE"

          # PGLite fallback path (no DATABASE_URL): the server needs to
          # init the in-process Postgres + push the Drizzle schema before
          # serving — give it up to 60s.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/privacy 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then echo "ready after ${i}s"; break; fi
            if ! docker ps --filter name=pert-li-smoke --format '{{.Status}}' | grep -q Up; then
              echo "::error::Container crashed during startup"
              docker logs pert-li-smoke 2>&1 | tail -50
              exit 1
            fi
            sleep 1
          done

          # Probe a handful of representative surfaces. /api/auth is a
          # server-handler route (Better Auth catch-all); / is SSR; the
          # rest are static-ish routes. All must respond 200.
          fail=0
          for path in / /privacy /signin /api/auth/get-session; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:18080${path}")
            echo "$path -> HTTP $code"
            [ "$code" = "200" ] || fail=1
          done

          echo "--- container logs ---"
          docker logs pert-li-smoke 2>&1 | tail -30

          docker rm -f pert-li-smoke >/dev/null
          exit "$fail"

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The verify job builds `.output/` and uploads it as the `build-output`
    # artefact. Running e2e against that artefact instead of `vite dev`
    # sidesteps the dev-mode optimizer (which on a cold runner blew past
    # the 120s webServer timeout) and exercises the actual production
    # bundle the deploy will ship.
    needs: verify
    env:
      CI: "true"
      # Playwright seeds the server with E2E_PGLITE=1 (see playwright.config.ts),
      # so an in-process Postgres handles all DB traffic — no real Postgres
      # needed. We still set BETTER_AUTH_SECRET to keep auth happy at load.
      BETTER_AUTH_SECRET: ci-only-not-secret-long-enough--
      ANTHROPIC_API_KEY: ci-placeholder
      # Tells playwright.config.ts to launch `node .output/server/index.mjs`
      # instead of `pnpm exec vite dev`. Without this flag the config falls
      # back to the dev server (used locally for HMR / fast iteration).
      E2E_USE_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve build scripts
        run: pnpm approve-builds --all
        continue-on-error: true

      # The verify job already ran `pnpm build`; reusing that artefact saves
      # ~30s and guarantees the e2e suite runs against the same bytes the
      # deploy will ship.
      - name: Download built server
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .output

      # Cache the Playwright browser binary keyed on the installed version
      # so we only download Chromium when @playwright/test changes.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium (+ system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Playwright tests
        run: pnpm e2e

      # Walk the JSON reporter output and write a markdown summary into
      # the job's GITHUB_STEP_SUMMARY. Runs on success AND failure so
      # passing runs still show per-spec timings + retries in the Actions
      # UI without downloading the HTML report.
      - name: E2E summary → job step summary
        if: always()
        run: node scripts/playwright-summary.mjs playwright-report/results.json >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Upload Playwright report
        # Always upload — passing runs are useful for spot-checking
        # per-test timings and step traces. The HTML report is small
        # enough that 14-day retention costs nothing meaningful.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload test traces
        # Traces are large (screenshots + DOM snapshots per step) so
        # we only keep them when something failed and a human is going
        # to open them.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 14

  storybook:
    name: storybook test-runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # @storybook/test-runner drives stories through Playwright; the
      # individual play functions don't hit the DB or auth, but importing
      # stories transitively pulls modules that read these at load time.
      BETTER_AUTH_SECRET: ci-only-not-secret
      ANTHROPIC_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # The storybook vite config calls scripts/compute-version.mjs, which
        # runs `git describe --tags`. Default shallow clone has only HEAD,
        # so the VersionFooter story would render the fallback.
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve build scripts
        run: pnpm approve-builds --all
        continue-on-error: true

      # Same Playwright browser caching strategy as the e2e job — the
      # test-runner uses Playwright under the hood, so we only need
      # Chromium and key the cache on the installed @playwright/test
      # version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium (+ system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # `storybook:ci` boots `storybook dev` on :6006 and runs the test
      # runner against it; concurrently kills the dev server when the
      # runner exits (`-k -s first`).
      - name: Storybook test-runner
        run: pnpm storybook:ci

  pr-screenshots:
    # PR-only, informational. Renders every story, pixel-diffs each against
    # the `main` baseline (baseline/ on the screenshots orphan branch), and
    # for the stories that actually changed pushes the new render + a diff
    # overlay to `pr-<num>/` and posts a sticky PR comment embedding them
    # inline via raw.githubusercontent.com (works anonymously now that the
    # repo is public; Camo proxies it). A tolerance heuristic (see
    # scripts/diff-screenshots.mjs) keeps sub-pixel noise from flagging a
    # story. Deliberately NOT in the ci-ready gate — a flake here should
    # never block merge.
    name: PR screenshots
    # Skip on forks: GITHUB_TOKEN on a fork PR is read-only by default,
    # so the screenshots-branch push would fail and the sticky comment
    # could not be created. Re-enable for forks later via a
    # pull_request_target variant if we want it.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # `contents: write` so we can push to the screenshots branch with
      # the default GITHUB_TOKEN. `pull-requests: write` for the sticky
      # comment action.
      contents: write
      pull-requests: write
    env:
      # Story modules transitively import code that reads these at load
      # time (better-auth client config, chat provider sniff). Dummy
      # values keep imports happy; nothing actually runs against them.
      BETTER_AUTH_SECRET: ci-only-not-secret
      ANTHROPIC_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # We need the merge base on disk to diff against — the default
          # shallow checkout only carries HEAD. fetch-depth 0 is overkill
          # for the diff but matches db-back-compat (cache hit overlap).
          fetch-depth: 0

      - name: Detect UI changes (quick gate)
        id: diff
        env:
          BASE_REF: origin/${{ github.base_ref }}
        # Eager gate: run the screenshot pipeline whenever the PR touches
        # anything plausibly UI-impacting. The precise filtering (which
        # stories actually appear in the comment) happens later in
        # `scripts/changed-stories.mjs` against the built storybook index,
        # using a directory-tree match — so this gate intentionally errs
        # on the side of running. A `pr-screenshots` run that finds zero
        # affected stories costs ~1-2min of CI; missing a UI change costs
        # a review round-trip, which is worse.
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --diff-filter=ACMRD "$BASE_REF"...HEAD -- \
            "src/**" \
            "tailwind*" \
            "components.json" \
            ".storybook/**" || true)
          if [ -z "$changed" ]; then
            echo "no UI-adjacent changes — skipping screenshot pipeline"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "$changed"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.diff.outputs.has_changes == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.diff.outputs.has_changes == 'true'
        run: pnpm install --frozen-lockfile

      - name: Approve build scripts
        if: steps.diff.outputs.has_changes == 'true'
        run: pnpm approve-builds --all
        continue-on-error: true

      - name: Resolve Playwright version
        if: steps.diff.outputs.has_changes == 'true'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.diff.outputs.has_changes == 'true'
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Same cache key as the e2e + storybook jobs so all three share
          # the warm download whenever any of them runs first.
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium (+ system deps)
        if: steps.diff.outputs.has_changes == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps only
        if: steps.diff.outputs.has_changes == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build Storybook
        if: steps.diff.outputs.has_changes == 'true'
        # Static build gives us a reproducible `index.json` (mapping
        # story id -> title/name/importPath) that the diff step uses to
        # label flagged stories, and lets test-storybook run against a
        # plain file server instead of `storybook dev` (no compile-on-demand
        # variance — important so the baseline and PR render identically).
        run: pnpm build-storybook --quiet

      - name: Screenshot every story
        if: steps.diff.outputs.has_changes == 'true'
        env:
          STORYBOOK_SCREENSHOT_DIR: ${{ github.workspace }}/pr-screenshots
        # `python3 -m http.server` ships with ubuntu-latest — avoids a
        # cold `pnpm dlx http-server` install on every run. We background
        # it, `wait-on` blocks until the port is live, then test-storybook
        # drives every story; the postVisit hook in .storybook/test-runner.ts
        # dumps a PNG per story into $STORYBOOK_SCREENSHOT_DIR.
        run: |
          set -euo pipefail
          mkdir -p "$STORYBOOK_SCREENSHOT_DIR"
          ( cd storybook-static && python3 -m http.server 6006 >/tmp/sb-http.log 2>&1 ) &
          echo "$!" > /tmp/sb-http.pid
          pnpm exec wait-on -l tcp:6006 -t 60000
          pnpm exec test-storybook --url http://localhost:6006 || {
            status=$?
            echo "test-storybook exited with $status; continuing so we still publish whatever rendered"
          }
          kill "$(cat /tmp/sb-http.pid)" 2>/dev/null || true

      - name: Fetch baseline from screenshots branch
        if: steps.diff.outputs.has_changes == 'true'
        # Pull the current `main` baseline (baseline/<id>.png) off the
        # screenshots orphan branch so we can pixel-diff this PR against it.
        # On a repo where the branch / baseline doesn't exist yet (first run
        # before any push-to-main has seeded it) we just create an empty
        # `baseline/` — every story then classifies as `new`, which is the
        # correct "no baseline to compare against" behaviour.
        run: |
          set -euo pipefail
          mkdir -p baseline
          if git ls-remote --exit-code --heads origin screenshots >/dev/null 2>&1; then
            git fetch -q --depth=1 origin screenshots
            # Extract only baseline/ from the fetched branch into ./baseline.
            git --work-tree=. checkout FETCH_HEAD -- baseline 2>/dev/null || \
              echo "screenshots branch has no baseline/ yet — treating all stories as new"
          else
            echo "no screenshots branch yet — treating all stories as new"
          fi
          echo "baseline images: $(find baseline -name '*.png' 2>/dev/null | wc -l)"

      - name: Diff against baseline
        if: steps.diff.outputs.has_changes == 'true'
        id: match
        # Pixel-compare every rendered story against the baseline. Only
        # stories the heuristic flags as changed / new / removed land in
        # changed-stories.json (unchanged ones are dropped). Diff overlays
        # go to pr-diff/; we stage the new render + overlay per flagged story.
        run: |
          set -euo pipefail
          node scripts/diff-screenshots.mjs \
            baseline pr-screenshots storybook-static/index.json pr-diff changed-stories.json
          jq '.stories[] | .id + " [" + .status + "] (" + .title + " / " + .name + ")"' changed-stories.json
          mkdir -p pr-staging
          # Stage the new render + (when present) the diff overlay for every
          # flagged story. `removed` stories have no render — skip them here;
          # the comment renders them as a text line.
          for id in $(jq -r '.stories[] | select(.status=="changed" or .status=="new") | .id' changed-stories.json); do
            if [ -f "pr-screenshots/${id}.png" ]; then
              cp "pr-screenshots/${id}.png" "pr-staging/${id}.png"
            else
              echo "::warning::no screenshot rendered for story id $id"
            fi
            [ -f "pr-diff/${id}.diff.png" ] && cp "pr-diff/${id}.diff.png" "pr-staging/${id}.diff.png" || true
          done
          ls -la pr-staging/ || true
          count=$(jq '.stories | length' changed-stories.json)
          echo "matched=$count" >> "$GITHUB_OUTPUT"

      - name: Publish to screenshots branch
        if: steps.match.outputs.matched != '' && steps.match.outputs.matched != '0'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-pr-screenshots.sh pr-staging

      - name: Build sticky-comment body
        if: steps.match.outputs.matched != '' && steps.match.outputs.matched != '0'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/build-pr-screenshot-comment.mjs changed-stories.json pr-staging comment.md

      - name: Post / update sticky PR comment
        if: steps.match.outputs.matched != '' && steps.match.outputs.matched != '0'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-screenshots
          path: comment.md

      - name: Remove sticky comment when nothing changed visually
        # Two paths land here: (1) the quick gate skipped entirely (no
        # UI-adjacent changes); (2) the gate ran but every story matched the
        # baseline within tolerance. Either way, wipe any stale comment so the
        # PR doesn't keep showing screenshots from a prior commit.
        if: steps.diff.outputs.has_changes != 'true' || steps.match.outputs.matched == '0'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-screenshots
          delete: true

      - name: Upload screenshots artifact (debug)
        if: steps.diff.outputs.has_changes == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-screenshots
          # All renders + the diff overlays + the classification JSON, so a
          # surprising flag (or a missed one) can be inspected offline.
          path: |
            pr-screenshots
            pr-diff
            changed-stories.json
          retention-days: 7
          if-no-files-found: ignore

  # Aggregate gate. Branch protection should require *this* job, not the
  # individual ones — adding a new job only needs editing one `needs:`
  # list, not the repo settings, and a job that legitimately skips on the
  # current event (e.g. db-back-compat on push-to-main) doesn't fail the
  # gate. Passes when every dependency is `success` or `skipped`.
  ci-ready:
    name: CI ready
    if: always()
    runs-on: ubuntu-latest
    needs: [verify, db-back-compat, docker-build, e2e, storybook]
    steps:
      - name: Check dependent jobs
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq .
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
