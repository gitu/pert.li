name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs for the same branch / PR — saves Actions minutes when
# new pushes land while a run is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: check + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build/test rely on these being present (even if dummy) — the
      # Automerge sync server reads DATABASE_URL at import time, and the
      # AI provider abstraction sniffs at least one key.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-not-secret
      ANTHROPIC_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          # The pre-approved build scripts (esbuild, swc, etc.) need to run
          # for native modules; pnpm refuses by default in CI without this.
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vite's pre-bundled deps and Vitest's transform cache live under
      # `node_modules/.vite` and `node_modules/.cache`. They're a function
      # of the lockfile (deps), the build config, and the source — restoring
      # them across runs skips the cold-start dep optimization in both
      # `pnpm test` (vitest's first transform) and `pnpm build`.
      - name: Cache Vite / Vitest deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.cache
          key: ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'vitest.config.ts') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'vitest.config.ts') }}-
            ${{ runner.os }}-vite-

      - name: Approve build scripts
        # pnpm 11 requires explicit approval for postinstall scripts even when
        # listed in pnpm.onlyBuiltDependencies. --all is fine here because
        # the allowlist is already declared in package.json.
        run: pnpm approve-builds --all
        continue-on-error: true

      - name: Biome (lint + format + organizeImports)
        run: pnpm check

      - name: Vitest
        run: pnpm test

      - name: Build
        run: pnpm build

  db-back-compat:
    # PR-only: confirm the Drizzle schema in this branch doesn't drop any
    # tables / columns that exist on the merge target. Because Cloud Build
    # runs `db:push` before swapping the image, an older revision can still
    # be live when the new schema lands — dropped columns would surface as
    # "column does not exist" errors against the in-flight requests.
    name: db schema backward compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # `git show <base>:src/db/schema.ts` needs the merge base in the
          # local repo; the default shallow fetch only carries HEAD.
          fetch-depth: 0

      - name: Compare schema against ${{ github.base_ref }}
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-db-back-compat.mjs

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # The Playwright config seeds the dev server with E2E_PGLITE=1, so an
      # in-process Postgres handles all DB traffic — no real Postgres needed.
      # We still set BETTER_AUTH_SECRET to keep auth happy at module load.
      BETTER_AUTH_SECRET: ci-only-not-secret
      ANTHROPIC_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve build scripts
        run: pnpm approve-builds --all
        continue-on-error: true

      # Without this cache the dev server's first run on a fresh node_modules
      # has to bundle ~50 @better-auth/* sub-packages through Vite's optimizer
      # before the SSR entry can load. Restoring the prior bundle drops that
      # from minutes to seconds. Same scheme as the verify job — keyed on the
      # inputs that invalidate the bundle, with a soft fallback to any prior
      # cache so the first PR after a lockfile bump still benefits.
      - name: Cache Vite deps
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-e2e-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'playwright.config.ts') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-vite-e2e-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'playwright.config.ts') }}-
            ${{ runner.os }}-vite-e2e-

      # Cache the Playwright browser binary keyed on the installed version
      # so we only download Chromium when @playwright/test changes.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium (+ system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Pre-bundle deps before Playwright launches its server. On a true cold
      # cache the optimizer takes 1–2 minutes for the better-auth surface; if
      # that work happens *during* the Playwright webServer wait the URL
      # probes return 503 ("Vite environment 'nitro' is unavailable") until
      # the entry can load, and the run times out. Doing it up-front means
      # `node_modules/.vite` is warm before the dev server starts.
      #
      # `vite optimize` is marked deprecated but still functions — it scans
      # the project, bundles deps into node_modules/.vite/deps, then exits.
      # On a warm cache restored from a prior run it's a fast no-op. The
      # outer `timeout` is a belt-and-braces guard against the rare case
      # where the optimizer hangs at shutdown rather than exiting cleanly.
      - name: Pre-bundle Vite deps
        env:
          # Match the env Playwright will use for the dev server so the
          # optimizer scans the same module graph.
          E2E_PGLITE: "1"
          VITE_E2E: "1"
          VITE_E2E_DISABLE_SYNC: "1"
          VITE_NEON_DISABLE: "1"
        run: timeout 180 pnpm exec vite optimize --force || true

      - name: Playwright tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 14

  storybook:
    name: storybook test-runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # @storybook/test-runner drives stories through Playwright; the
      # individual play functions don't hit the DB or auth, but importing
      # stories transitively pulls modules that read these at load time.
      BETTER_AUTH_SECRET: ci-only-not-secret
      ANTHROPIC_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve build scripts
        run: pnpm approve-builds --all
        continue-on-error: true

      # Same Playwright browser caching strategy as the e2e job — the
      # test-runner uses Playwright under the hood, so we only need
      # Chromium and key the cache on the installed @playwright/test
      # version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium (+ system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # `storybook:ci` boots `storybook dev` on :6006 and runs the test
      # runner against it; concurrently kills the dev server when the
      # runner exits (`-k -s first`).
      - name: Storybook test-runner
        run: pnpm storybook:ci
