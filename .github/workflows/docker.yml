name: Docker

on:
  push:
    branches: [main]
    tags: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Build -----------------------------------------------------------------
  # Build the image, gate it, push to ghcr.io, then attach a generated SBOM and a
  # Sigstore-signed SLSA provenance attestation to each pushed image (out-of-band,
  # by digest — see the attest steps below). Needs packages:write (push) +
  # contents:write (checkout + attach SBOMs to the GitHub Release on tag builds) +
  # id-token:write & attestations:write (attestations).
  build:
    name: build + push ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # write (not read) so anchore/sbom-action can attach the generated SBOMs to
      # the matching GitHub Release on tag (v*) builds. Safe here: this workflow
      # only runs on main / tags (never on fork PRs), so the elevated token is
      # never exposed to untrusted code.
      contents: write
      packages: write
      # Mint the OIDC token Sigstore uses to issue a short-lived signing cert, and
      # persist the resulting attestations. Required by actions/attest-*.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # `git describe --tags` needs the tag we're triggered on plus enough
        # history to count commits-since-tag. The default shallow clone has
        # only HEAD so the resolver would always fall back.
        with:
          fetch-depth: 0

      - name: Resolve APP_VERSION
        id: version
        # Tag triggers: returns the tag itself (e.g. `v0.3.2`). Pushes
        # between tags: `vX.Y.Z-N-gSHA`. Baked into the image via build-arg.
        run: echo "value=$(node scripts/compute-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the owner — ghcr.io repository paths must be lowercase
      # but ${{ github.repository }} preserves the original casing.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            # Full 40-char commit SHA, no `sha-` prefix. The deploy-only
            # Cloud Build trigger is run with `--sha=<commit>` and pulls
            # exactly this tag via `${COMMIT_SHA}` — an immutable, unambiguous
            # handle (short-SHA length matching would be fragile).
            type=sha,prefix=,format=long
          # metadata-action already auto-derives created/revision/source/url/
          # title/description/licenses from the repo. These add the rest and pin
          # version to the precise compute-version.mjs value (vX.Y.Z-N-gSHA) —
          # more exact than the tag-derived default and the reason the Dockerfile
          # no longer hardcodes the title/version LABELs.
          labels: |
            org.opencontainers.image.title=pert.li
            org.opencontainers.image.description=TanStack Start chat app powered by Claude, with PERT planning
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.vendor=gitu
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md

      # Build the runner image into the local daemon (not pushed yet) so the
      # secret-leak gate below can run against the real `.output/public`
      # bundle inside it. `cache-to` is written here; the push step reuses
      # this cache and is therefore a near-instant no-op rebuild.
      - name: Build image (load for the secret-leak gate)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pert-li:scan
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          # type=gha is the fast, same-region warm cache; the registry
          # `:buildcache` tag is a durable backstop that survives GHA's 10GB
          # LRU eviction (mode=max exports every layer, incl. the cached
          # `pnpm install`). The push step below reuses this.
          cache-from: |
            type=gha
            type=registry,ref=${{ steps.img.outputs.name }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ steps.img.outputs.name }}:buildcache,mode=max

      # Pre-push gate: the production client bundle must never contain a
      # secret value, and no server-only module may be dragged into a client
      # chunk. GitHub doesn't hold the real prod secrets, so we feed the
      # scanner randomly-generated sentinels. This proves (a) the gate runs
      # end-to-end against the freshly built bundle and (b) the server-only
      # modules in SERVER_MARKERS were tree-shaken out of the client graph —
      # that second check needs no real secret and is the meaningful one.
      # (Cloud Build runs the same script with the *real* Secret Manager
      # values; this is the always-on smoke test that travels with the build.)
      - name: Secret-leak gate (synthetic secrets)
        run: |
          export DATABASE_URL="postgres://scan:$(openssl rand -hex 16)@example.invalid/scan"
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          export GEMINI_API_KEY="AIza-$(openssl rand -hex 24)"
          export RESEND_API_KEY="re_$(openssl rand -hex 24)"
          docker run --rm \
            -v "$PWD":/workspace \
            -w /app \
            -e BUNDLE_DIR=/app/.output/public \
            -e SECRET_CHECK_KEYS=DATABASE_URL,BETTER_AUTH_SECRET,GEMINI_API_KEY,RESEND_API_KEY \
            -e DATABASE_URL \
            -e BETTER_AUTH_SECRET \
            -e GEMINI_API_KEY \
            -e RESEND_API_KEY \
            --entrypoint node \
            pert-li:scan \
            /workspace/scripts/check-secret-leak.mjs

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          # Full cache hit from the load-for-scan build above (identical
          # `runner` layers) — no cache-to needed.
          cache-from: |
            type=gha
            type=registry,ref=${{ steps.img.outputs.name }}:buildcache

      # ---- Supply-chain attestations (runner) --------------------------------
      # Out-of-band, by digest: we sign the pushed manifest as a referrer rather
      # than baking BuildKit `provenance:`/`sbom:` into the build. The latter would
      # wrap this single-platform image in an OCI image index, which is exactly the
      # artifact the Cloud Run deploy pulls through the Artifact Registry remote
      # proxy of ghcr.io — and AR-proxy fidelity for attestation sub-manifests is
      # not guaranteed. Signing by digest keeps the runnable image a plain manifest.
      - name: Generate SBOM (runner)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-runner.spdx.json
          # On tag (v*) builds, attach the SBOM to the matching GitHub Release
          # (needs the job's contents:write) in addition to the signed registry
          # attestation below. The per-run workflow artifact is redundant with
          # both, so skip it.
          upload-artifact: false
          upload-release-assets: true
      - name: Attest SBOM (runner)
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-runner.spdx.json
          push-to-registry: true
      - name: Attest provenance (runner)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # ---- Eval image (separate package, matching version tags) -------------
      # Publish the bring-your-own-LLM eval runner (Dockerfile `eval` target) as
      # its own ghcr package, `<image>-evals`, carrying the SAME tag set as the
      # runner above so `…-evals:vX.Y.Z` lines up 1:1 with the runner `vX.Y.Z`.
      # It's `FROM build`, so it reuses the layers the runner build just cached
      # (cache-from: gha) — the only added cost is pushing the source + dev-deps
      # layer. Self-hosters can then `docker run …-evals` to validate the prompt
      # against their own LLM without a local build (see SELF_HOSTING.md § Evals).
      - name: Extract metadata (eval image)
        id: meta-eval
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}-evals
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=sha,prefix=,format=long
          # Same label set as the runner, retitled for the eval package.
          labels: |
            org.opencontainers.image.title=pert.li evals
            org.opencontainers.image.description=Bring-your-own-LLM eval runner for the pert.li chat assistant
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.vendor=gitu
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/SELF_HOSTING.md

      - name: Build and push eval image
        id: push-eval
        uses: docker/build-push-action@v7
        with:
          context: .
          target: eval
          push: true
          tags: ${{ steps.meta-eval.outputs.tags }}
          labels: ${{ steps.meta-eval.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          # eval is `FROM build`, so the runner `:buildcache` already carries
          # the shared `build` stage layers (mode=max) — read it for those,
          # plus the eval package's own buildcache for the extra source/dev-deps
          # layer it adds on top.
          cache-from: |
            type=gha
            type=registry,ref=${{ steps.img.outputs.name }}:buildcache
            type=registry,ref=${{ steps.img.outputs.name }}-evals:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ steps.img.outputs.name }}-evals:buildcache,mode=max

      # ---- Supply-chain attestations (eval) — same out-of-band pattern -------
      - name: Generate SBOM (eval)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.name }}-evals@${{ steps.push-eval.outputs.digest }}
          format: spdx-json
          output-file: sbom-eval.spdx.json
          # See the runner SBOM step — attach to the Release, skip the per-run
          # workflow artifact.
          upload-artifact: false
          upload-release-assets: true
      - name: Attest SBOM (eval)
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.img.outputs.name }}-evals
          subject-digest: ${{ steps.push-eval.outputs.digest }}
          sbom-path: sbom-eval.spdx.json
          push-to-registry: true
      - name: Attest provenance (eval)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.img.outputs.name }}-evals
          subject-digest: ${{ steps.push-eval.outputs.digest }}
          push-to-registry: true

  # ---- Deploy ----------------------------------------------------------------
  # Runs only after `build` succeeds (image is on ghcr.io). We do NOT rebuild
  # on the Google side: a deploy-only Cloud Build trigger pulls THIS image
  # through an Artifact Registry remote-repo proxy of ghcr.io, re-runs the
  # secret-leak gate against the real Secret Manager values, applies the
  # version gate, and rolls out to Cloud Run. See DEPLOY.md for the one-time
  # WIF + remote-repo + trigger setup.
  #   main  → staging trigger (_VERSION_GATE=off, always deploys)
  #   tag v* → prod trigger    (_VERSION_GATE=on,  from-main + newest only)
  # Separate job (not just a step) so the deploy carries only id-token:write,
  # re-runs independently of the build, and shows as its own gate in the UI.
  deploy:
    name: deploy (Cloud Build)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # Run the deploy-only trigger pinned to THIS commit. `--sha` sets
      # $COMMIT_SHA inside the build, which resolves the exact ghcr image tag
      # to pull and deploy. The triggers are manual-invocation (they do NOT
      # auto-fire on push) so this is the single, ordered deploy path — no
      # race with the image push in the build job.
      - name: Trigger Cloud Run deploy
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Only v* tags promote to prod (matches the old on-version
            # `^v.*$` trigger). A non-release tag still builds + pushes the
            # image in `build`, but does not run the prod trigger / touch
            # prod secrets.
            case "${{ github.ref_name }}" in
              v*) TRIGGER="${{ vars.CLOUD_BUILD_PROD_TRIGGER }}" ;;
              *)  echo "Tag '${{ github.ref_name }}' is not a v* release tag — image pushed, no deploy."; exit 0 ;;
            esac
          else
            TRIGGER="${{ vars.CLOUD_BUILD_STAGING_TRIGGER }}"
          fi
          echo "Running Cloud Build trigger '$TRIGGER' at ${{ github.sha }}"
          gcloud builds triggers run "$TRIGGER" \
            --sha="${{ github.sha }}" \
            --region="${{ vars.CLOUD_BUILD_REGION }}"
