# External Postgres topology — you provide the database; we just ship the app.
#
# Required keys:
#   BETTER_AUTH_SECRET   — generate with `pnpm dlx @better-auth/cli secret`
#   DATABASE_URL         — full Postgres connection string for your DB
#
# At least one LLM provider key:
#   ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY
#
# See deploy/k8s/postgres-statefulset/10-secret.yaml for the full list of
# optional keys (SMTP, OIDC, …) the app honors.

apiVersion: v1
kind: Secret
metadata:
  name: pertli
  namespace: pertli
type: Opaque
stringData:
  BETTER_AUTH_SECRET: "REPLACE-ME"
  DATABASE_URL: "postgres://user:pass@db.internal:5432/pertli?sslmode=require"
  # ANTHROPIC_API_KEY: "sk-ant-..."
