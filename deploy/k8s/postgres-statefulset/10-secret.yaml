# DO NOT commit a real Secret with values. Either:
#   1. Apply this file with placeholders, then `kubectl edit secret pertli -n pertli`, OR
#   2. Skip this file and create the secret imperatively (see deploy/k8s/README.md).
#
# Required keys:
#   BETTER_AUTH_SECRET   — generate with `pnpm dlx @better-auth/cli secret`
#   POSTGRES_PASSWORD    — strong random; created on the Postgres pod's first start
#
# At least one of these is needed for the in-app AI assistant:
#   ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY
#
# Optional (omit keys you don't need):
#   OPENAI_BASE_URL, LLM_PROVIDER, LLM_MODEL
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM, SMTP_SECURE
#   RESEND_API_KEY, RESEND_FROM_EMAIL
#   OIDC_PROVIDER_ID, OIDC_PROVIDER_NAME, OIDC_DISCOVERY_URL,
#   OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_SCOPES
#   PRIVACY_POLICY_URL

apiVersion: v1
kind: Secret
metadata:
  name: pertli
  namespace: pertli
type: Opaque
stringData:
  BETTER_AUTH_SECRET: "REPLACE-ME"
  POSTGRES_PASSWORD: "REPLACE-ME"
  # ANTHROPIC_API_KEY: "sk-ant-..."
