# Deploy-only Cloud Build pipeline.
#
# The image is built, secret-leak-gated (synthetic secrets), and pushed to
# ghcr.io by GitHub Actions (.github/workflows/docker.yml). This config does
# NOT rebuild it — that would duplicate the GitHub build. It is invoked, once
# the image is on ghcr.io, by that workflow via
# `gcloud builds triggers run <trigger> --sha=<commit>`. It:
#   1. pulls THIS commit's image through an Artifact Registry remote-repo
#      proxy of ghcr.io (no Google-side build, no push),
#   2. re-runs the secret-leak gate against the REAL Secret Manager values,
#   3. applies the production promotion gate (_VERSION_GATE),
#   4. rolls the image out to Cloud Run.
#
# The same file drives two MANUAL-INVOCATION triggers — staging and prod —
# that differ only by substitutions:
#
#   Trigger: "deploy staging" (run by GH on main)   Trigger: "deploy prod" (run by GH on tag v*)
#   ─────────────────────────────────────────────   ────────────────────────────────────────────
#   _SERVICE: pert-li-staging                        _SERVICE: pert-li
#   _BETTER_AUTH_URL: https://staging.pert.li        _BETTER_AUTH_URL: https://pert.li
#   _DATABASE_URL_SECRET: DATABASE_URL_STAGING       _DATABASE_URL_SECRET: DATABASE_URL
#   _VERSION_GATE: "off"                             _VERSION_GATE: "on"
#
# Both triggers are MANUAL — they do NOT auto-fire on push. GitHub drives the
# deploy after the image is pushed, so there is no race between "image on
# ghcr.io" and "deploy pulls image". Defaults below are the production values.
#
# Promotion model (unchanged):
#   • Staging tracks main head-on: every push deploys to `pert-li-staging`
#     with `_VERSION_GATE: "off"` — no gate.
#   • Production only advances to a *newer version that shipped through main*.
#     The prod trigger runs with `_VERSION_GATE: "on"`; the `version-gate`
#     step deploys only when the tagged commit is an ancestor of `origin/main`
#     AND the tag is the newest `v*` version reachable from main. A tag on a
#     side branch, or an older / re-pushed tag, skips the rollout — prod never
#     moves backwards. Release: merge to main, then
#     `git tag vX.Y.Z <main-commit> && git push origin vX.Y.Z`.
#
# Image reference: GitHub pushes a tag equal to the full commit SHA
# (docker/metadata `type=sha,prefix=,format=long`). The trigger is run with
# `--sha=<commit>`, so `${COMMIT_SHA}` resolves the exact image. The
# remote-repo proxy lazily fetches + caches it from ghcr.io on first pull.
#
# Substitution variables (set on the trigger or via `--substitutions`):
#   _REGION                  deploy region + AR location, e.g. europe-west1
#   _SERVICE                 Cloud Run service name (per-env)
#   _REMOTE_REPO             AR remote repository proxying https://ghcr.io
#   _GHCR_IMAGE              lowercase ghcr path: <owner>/<repo>
#   _BETTER_AUTH_URL         public URL of the service
#   _RESEND_FROM_EMAIL       sender for magic-link emails
#   _DATABASE_URL_SECRET     Secret Manager entry holding the per-env DB URL
#   _BETTER_AUTH_SECRET_NAME Secret Manager entry for the per-env auth secret
#   _GEMINI_API_KEY_SECRET   Secret Manager entry for the AI provider key
#   _RESEND_API_KEY_SECRET   Secret Manager entry for the transactional email key
#   _VERSION_GATE            "on"  → gate the rollout on the from-main + newest-
#                                    version checks (production tag trigger).
#                            "off" → always roll out (staging). Default off.
substitutions:
  _REGION: europe-west1
  _SERVICE: pert-li
  _REMOTE_REPO: ghcr-remote
  _GHCR_IMAGE: gitu/pert.li
  _BETTER_AUTH_URL: https://pert.li
  _RESEND_FROM_EMAIL: noreply@pert.li
  _DATABASE_URL_SECRET: DATABASE_URL
  _BETTER_AUTH_SECRET_NAME: BETTER_AUTH_SECRET
  _GEMINI_API_KEY_SECRET: GEMINI_API_KEY
  _RESEND_API_KEY_SECRET: RESEND_API_KEY
  _VERSION_GATE: "off"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 0b. Resolve the human-readable build version (e.g. `v0.3.2`, or
  #     `v0.3.2-4-gabc1234` between tags) from git. Recorded as an env var on
  #     the Cloud Run service (deploy step) and used by the version-gate as
  #     the "new" version. Mirrors scripts/compute-version.mjs (same value
  #     GitHub baked into the image via --build-arg APP_VERSION).
  - id: compute-version
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    waitFor: ["-"]
    args:
      - -c
      - |
        set -euo pipefail
        git fetch --tags --depth=100 2>/dev/null || true
        git describe --tags --always --dirty > /workspace/APP_VERSION
        printf 'APP_VERSION=%s\n' "$(cat /workspace/APP_VERSION)"

  # 0c. Promotion gate. Decides whether the deploy step may roll out, by
  #     writing `yes`/`no` to /workspace/DEPLOY_GO (the deploy step reads it
  #     and is a no-op on `no`). Only gates when `_VERSION_GATE=on` (production
  #     tag trigger); staging passes `off` and always deploys.
  #
  #     With the gate on, prod rolls out only when BOTH hold:
  #       1. "from main"  — the built commit (HEAD) is an ancestor of
  #          origin/main, so the release shipped through the main line.
  #       2. "newer than current" — the version (= the pushed tag) is the
  #          highest `v*` tag reachable from main, by `sort -V`. An older or
  #          re-pushed tag is not the max, so prod never rolls backwards.
  #     Either check failing writes `no` and exits 0 (clean skip).
  - id: version-gate
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    waitFor: ["compute-version"]
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_VERSION_GATE}" != "on" ]; then
          echo "version gate off (_VERSION_GATE=${_VERSION_GATE}) — deploy allowed"
          echo yes > /workspace/DEPLOY_GO
          exit 0
        fi

        # fail_unverifiable: when the gate is ON we must never silently skip a
        # real release because of a transient fetch/auth problem. A genuine
        # "not on main" / "not newest" verdict is a clean skip (exit 0); an
        # inability to *establish the facts* fails the build loudly (exit 1)
        # so the release is retried rather than quietly dropped.
        fail_unverifiable() {
          echo "GATE: cannot verify prod promotion — $$1" >&2
          echo "GATE: failing the build instead of skipping, so a real release is not silently dropped." >&2
          exit 1
        }

        # Need full history + tags to resolve ancestry and the version set.
        # Cloud Build gives a shallow clone; unshallow best-effort (a complete
        # clone makes --unshallow fail harmlessly — that's fine).
        git fetch --unshallow 2>/dev/null || git fetch 2>/dev/null || true
        # origin/main and the tag set are prerequisites — these MUST succeed.
        git fetch origin '+refs/heads/main:refs/remotes/origin/main' 2>/dev/null \
          || fail_unverifiable "git fetch origin main failed"
        git rev-parse --verify -q origin/main >/dev/null \
          || fail_unverifiable "origin/main could not be resolved after fetch"
        git fetch --tags 2>/dev/null \
          || fail_unverifiable "git fetch --tags failed"

        NEW="$(cat /workspace/APP_VERSION)"

        # 1. from-main: HEAD must be an ancestor of origin/main. Distinguish a
        #    real "not an ancestor" (rc=1 → skip) from a merge-base error
        #    (rc>1 → unverifiable → fail).
        set +e
        git merge-base --is-ancestor HEAD origin/main
        rc=$$?
        set -e
        if [ "$$rc" -gt 1 ]; then
          fail_unverifiable "git merge-base errored (rc=$$rc)"
        fi
        if [ "$$rc" -ne 0 ]; then
          echo "GATE: commit $(git rev-parse --short HEAD) is not on main — skipping prod rollout"
          echo no > /workspace/DEPLOY_GO
          exit 0
        fi

        # 2. newest-version: NEW must be the highest v* tag reachable from main.
        #    HEAD is on main (check 1) and the prod trigger fires on a v* tag,
        #    so that tag is merged into main and the list cannot legitimately
        #    be empty — an empty result here means the tag set didn't resolve,
        #    which is unverifiable, not a clean "no tags".
        HIGHEST="$(git tag --merged origin/main --list 'v*' | sort -V | tail -1)"
        if [ -z "$$HIGHEST" ]; then
          fail_unverifiable "no v* tags resolved on main (tag fetch incomplete?)"
        fi
        if [ "$$NEW" != "$$HIGHEST" ]; then
          echo "GATE: version $$NEW is not the newest on main (newest is $$HIGHEST) — skipping prod rollout"
          echo no > /workspace/DEPLOY_GO
          exit 0
        fi

        echo "GATE: $$NEW is on main and the newest version — prod rollout allowed"
        echo yes > /workspace/DEPLOY_GO

  # 1. Secret-leak gate against the REAL Secret Manager values. Pulls THIS
  #    commit's image through the AR remote-repo proxy and scans its client
  #    bundle (.output/public) for any literal secret value or server-only
  #    module that leaked into a client chunk. GitHub already ran this with
  #    synthetic secrets; this is the defense-in-depth pass with the actual
  #    per-env values. Scripts come from the trigger's source checkout
  #    (mounted at /workspace), pinned to ${COMMIT_SHA}.
  - id: secrets-check
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ["-"]
    secretEnv:
      - DATABASE_URL
      - BETTER_AUTH_SECRET
      - GEMINI_API_KEY
      - RESEND_API_KEY
    args:
      - -c
      - |
        set -euo pipefail
        # The cloud-builders/docker builder auto-authenticates to this
        # project's Artifact Registry (incl. the remote-repo proxy), so the
        # pull below needs no `gcloud auth configure-docker` — and this image
        # has no gcloud anyway.
        IMAGE=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REMOTE_REPO}/${_GHCR_IMAGE}:${COMMIT_SHA}
        docker run --rm \
          -v "$$PWD":/workspace \
          -w /app \
          -e BUNDLE_DIR=/app/.output/public \
          -e SECRET_CHECK_KEYS=DATABASE_URL,BETTER_AUTH_SECRET,GEMINI_API_KEY,RESEND_API_KEY \
          -e DATABASE_URL \
          -e BETTER_AUTH_SECRET \
          -e GEMINI_API_KEY \
          -e RESEND_API_KEY \
          --entrypoint node \
          "$$IMAGE" \
          /workspace/scripts/check-secret-leak.mjs

  # Schema management runs at container start, not here. The runner image's
  # entrypoint (`scripts/docker-entrypoint.sh` → `scripts/migrate.mjs`)
  # applies versioned SQL migrations from `./drizzle/` against the live DB
  # before the server binds. See DEPLOY.md for the BASELINE_MIGRATIONS escape
  # hatch (`42710 ... already exists`).

  # 2. Deploy to Cloud Run from the proxied image — but only if the
  #    version-gate (step 0c) said yes. On a gated prod build that didn't win
  #    the gate, DEPLOY_GO=no and this step is a clean no-op. min=0 (scale to
  #    zero); session-affinity keeps a client on one instance so the in-memory
  #    Automerge Repo stays consistent for their session. APP_VERSION is
  #    recorded as a service env var so the live version is visible via
  #    `gcloud run services describe`.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    waitFor: ["secrets-check", "version-gate", "compute-version"]
    args:
      - -c
      - |
        set -euo pipefail
        if [ "$(cat /workspace/DEPLOY_GO 2>/dev/null || echo no)" != "yes" ]; then
          echo "deploy skipped — version gate did not approve this build for ${_SERVICE}"
          exit 0
        fi
        APP_VERSION="$(cat /workspace/APP_VERSION)"
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REMOTE_REPO}/${_GHCR_IMAGE}:${COMMIT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --min-instances=0 \
          --max-instances=3 \
          --concurrency=80 \
          --cpu=1 \
          --memory=1Gi \
          --timeout=3600 \
          --session-affinity \
          --set-env-vars=NODE_ENV=production,AUTOMERGE_STORAGE=postgres,BETTER_AUTH_URL=${_BETTER_AUTH_URL},RESEND_FROM_EMAIL=${_RESEND_FROM_EMAIL},APP_VERSION="$$APP_VERSION" \
          --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,BETTER_AUTH_SECRET=${_BETTER_AUTH_SECRET_NAME}:latest,GEMINI_API_KEY=${_GEMINI_API_KEY_SECRET}:latest,RESEND_API_KEY=${_RESEND_API_KEY_SECRET}:latest

# Secret Manager bindings — referenced by the secrets-check step's secretEnv.
# The Secret Manager entry names are substitution-driven so the same YAML can
# target staging vs prod with distinct secret stores (see header matrix).
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/${_DATABASE_URL_SECRET}/versions/latest
      env: DATABASE_URL
    - versionName: projects/${PROJECT_ID}/secrets/${_BETTER_AUTH_SECRET_NAME}/versions/latest
      env: BETTER_AUTH_SECRET
    - versionName: projects/${PROJECT_ID}/secrets/${_GEMINI_API_KEY_SECRET}/versions/latest
      env: GEMINI_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/${_RESEND_API_KEY_SECRET}/versions/latest
      env: RESEND_API_KEY
