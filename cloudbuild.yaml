# Cloud Build pipeline. The same file drives two triggers — staging on every
# push to main, production on a `v*` git tag — by overriding substitutions:
#
#   Trigger: "main → staging"      Trigger: "tag v* → prod"
#   ─────────────────────────      ───────────────────────
#   Event:   push to refs/heads/main  Event:   push to refs/tags/v*
#   _SERVICE: pert-li-staging         _SERVICE: pert-li
#   _BETTER_AUTH_URL: https://staging.pert.li/
#                                    _BETTER_AUTH_URL: https://pert.li/
#   _DATABASE_URL_SECRET: DATABASE_URL_STAGING
#                                    _DATABASE_URL_SECRET: DATABASE_URL
#   _BETTER_AUTH_SECRET_NAME: BETTER_AUTH_SECRET_STAGING
#                                    _BETTER_AUTH_SECRET_NAME: BETTER_AUTH_SECRET
#   _VERSION_GATE: "off"              _VERSION_GATE: "on"
#   (same pattern for GEMINI_API_KEY_SECRET, RESEND_API_KEY_SECRET)
#
# Both triggers run this YAML; the only difference is which substitutions and
# secret names they point at. Defaults below are the production values so a
# bare `gcloud builds submit` still deploys prod — the staging trigger MUST
# override every `_*_SECRET` variable to a separate Secret Manager entry, or
# the staging service will read/write the prod database.
#
# Promotion model:
#   • Staging tracks main head-on: every push builds and rolls out to
#     `pert-li-staging`. No gate — staging is meant to run ahead of prod.
#   • Production only advances to a *newer version that shipped through main*.
#     The prod trigger fires on a `v*` tag with `_VERSION_GATE: "on"`; the
#     `version-gate` step (below) then deploys only when the tagged commit is
#     an ancestor of `origin/main` ("from main") AND the tag is the newest
#     `v*` version reachable from main ("newer than the current one"). A tag
#     on a side branch, or an older / re-pushed tag, still builds and pushes
#     the image but SKIPS the rollout — prod never moves backwards. Release
#     flow: merge to main, then `git tag vX.Y.Z <main-commit> && git push
#     origin vX.Y.Z`.
#
# Substitution variables (set on the trigger or via `--substitutions`):
#   _REGION                  deploy region, e.g. europe-west1
#   _SERVICE                 Cloud Run service name (per-env)
#   _REPO                    Artifact Registry repo, e.g. pert-li
#   _BETTER_AUTH_URL         public URL of the service
#   _RESEND_FROM_EMAIL       sender for magic-link emails; `onboarding@resend.dev`
#                            works for accounts without a verified domain (only
#                            delivers to the API key's owner address).
#   _DATABASE_URL_SECRET     Secret Manager entry holding the per-env DB URL
#   _BETTER_AUTH_SECRET_NAME Secret Manager entry for the per-env auth secret
#   _GEMINI_API_KEY_SECRET   Secret Manager entry for the AI provider key
#   _RESEND_API_KEY_SECRET   Secret Manager entry for the transactional email key
#   _VERSION_GATE            "on"  → gate the rollout on the from-main + newest-
#                                    version checks (production tag trigger).
#                            "off" → always roll out (staging, and manual
#                                    `gcloud builds submit` runs). Default off.
#
# The build version baked into the bundle (`import.meta.env.VITE_APP_VERSION`,
# surfaced as the footer on /privacy and /signin) is resolved at build time
# from `git describe --tags --always --dirty` — see the compute-version step.
substitutions:
  _REGION: europe-west1
  _SERVICE: pert-li
  _REPO: pert-li
  _BETTER_AUTH_URL: https://pert-li.example.run.app
  _RESEND_FROM_EMAIL: onboarding@resend.dev
  _DATABASE_URL_SECRET: DATABASE_URL
  _BETTER_AUTH_SECRET_NAME: BETTER_AUTH_SECRET
  _GEMINI_API_KEY_SECRET: GEMINI_API_KEY
  _RESEND_API_KEY_SECRET: RESEND_API_KEY
  _VERSION_GATE: "off"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # 0a. Pre-pull cache images for each intermediate stage AND the final
  #     `:latest`. The runner image only ships final-stage layers, so without
  #     per-stage cache images we'd lose hits on the slow `deps` and `build`
  #     stages (pnpm fetch + install + tsc + vite). All best-effort — the
  #     first ever build has nothing to pull.
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        for tag in cache-deps cache-build cache-prod-deps latest; do
          docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:$$tag || true
        done

  # 0b. Resolve the human-readable build version (e.g. `v0.3.2`, or
  #     `v0.3.2-4-gabc1234` between tags). Cloud Build hands us a shallow
  #     clone with no tags, so `git fetch --tags` first. Persisted to a
  #     workspace file so subsequent docker build steps can read it as
  #     `$(cat /workspace/APP_VERSION)`. Mirrors scripts/compute-version.mjs.
  - id: compute-version
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    waitFor: ["-"]
    args:
      - -c
      - |
        set -euo pipefail
        git fetch --tags --depth=100 2>/dev/null || true
        git describe --tags --always --dirty > /workspace/APP_VERSION
        printf 'APP_VERSION=%s\n' "$(cat /workspace/APP_VERSION)"

  # 0c. Promotion gate. Decides whether the deploy step at the end may roll
  #     out, by writing `yes`/`no` to /workspace/DEPLOY_GO (the deploy step
  #     reads it and is a no-op on `no`). Runs on every build but only gates
  #     when `_VERSION_GATE=on` (production tag trigger); staging and manual
  #     submits pass `off` and always deploy.
  #
  #     With the gate on, prod rolls out only when BOTH hold:
  #       1. "from main"  — the built commit (HEAD) is an ancestor of
  #          origin/main, so the release shipped through the main line and not
  #          off a side branch / detached tag.
  #       2. "newer than current" — the version (= the pushed tag, via
  #          `git describe` on a tagged commit) is the highest `v*` tag
  #          reachable from main, by `sort -V`. An older or re-pushed tag is
  #          not the max, so prod never rolls backwards.
  #     Either check failing writes `no` and exits 0 — the image is still built
  #     and pushed (handy for inspection / manual rollout), just not deployed.
  - id: version-gate
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    waitFor: ["compute-version"]
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_VERSION_GATE}" != "on" ]; then
          echo "version gate off (_VERSION_GATE=${_VERSION_GATE}) — deploy allowed"
          echo yes > /workspace/DEPLOY_GO
          exit 0
        fi

        # fail_unverifiable: when the gate is ON we must never silently skip a
        # real release because of a transient fetch/auth problem. A genuine
        # "not on main" / "not newest" verdict is a clean skip (exit 0); an
        # inability to *establish the facts* fails the build loudly (exit 1)
        # so the release is retried rather than quietly dropped.
        fail_unverifiable() {
          echo "GATE: cannot verify prod promotion — $$1" >&2
          echo "GATE: failing the build instead of skipping, so a real release is not silently dropped." >&2
          exit 1
        }

        # Need full history + tags to resolve ancestry and the version set.
        # Cloud Build gives a shallow clone; unshallow best-effort (a complete
        # clone makes --unshallow fail harmlessly — that's fine).
        git fetch --unshallow 2>/dev/null || git fetch 2>/dev/null || true
        # origin/main and the tag set are prerequisites — these MUST succeed.
        git fetch origin '+refs/heads/main:refs/remotes/origin/main' 2>/dev/null \
          || fail_unverifiable "git fetch origin main failed"
        git rev-parse --verify -q origin/main >/dev/null \
          || fail_unverifiable "origin/main could not be resolved after fetch"
        git fetch --tags 2>/dev/null \
          || fail_unverifiable "git fetch --tags failed"

        NEW="$(cat /workspace/APP_VERSION)"

        # 1. from-main: HEAD must be an ancestor of origin/main. Distinguish a
        #    real "not an ancestor" (rc=1 → skip) from a merge-base error
        #    (rc>1 → unverifiable → fail).
        set +e
        git merge-base --is-ancestor HEAD origin/main
        rc=$$?
        set -e
        if [ "$$rc" -gt 1 ]; then
          fail_unverifiable "git merge-base errored (rc=$$rc)"
        fi
        if [ "$$rc" -ne 0 ]; then
          echo "GATE: commit $(git rev-parse --short HEAD) is not on main — skipping prod rollout"
          echo no > /workspace/DEPLOY_GO
          exit 0
        fi

        # 2. newest-version: NEW must be the highest v* tag reachable from main.
        #    HEAD is on main (check 1) and the prod trigger fires on a v* tag,
        #    so that tag is merged into main and the list cannot legitimately
        #    be empty — an empty result here means the tag set didn't resolve,
        #    which is unverifiable, not a clean "no tags".
        HIGHEST="$(git tag --merged origin/main --list 'v*' | sort -V | tail -1)"
        if [ -z "$$HIGHEST" ]; then
          fail_unverifiable "no v* tags resolved on main (tag fetch incomplete?)"
        fi
        if [ "$$NEW" != "$$HIGHEST" ]; then
          echo "GATE: version $$NEW is not the newest on main (newest is $$HIGHEST) — skipping prod rollout"
          echo no > /workspace/DEPLOY_GO
          exit 0
        fi

        echo "GATE: $$NEW is on main and the newest version — prod rollout allowed"
        echo yes > /workspace/DEPLOY_GO

  # 1a. Build + push the `deps` stage as its own cache image. This is the
  #     stage that runs `pnpm fetch` and is invalidated only when the
  #     lockfile / package.json changes — cache hits here save the most time.
  - id: build-deps-cache
    name: gcr.io/cloud-builders/docker
    waitFor: ["pull-cache"]
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --target=deps
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-deps
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-deps
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .

  # 1b. Build + push the `build` stage. Includes the deps stage + the
  #     compile step (`pnpm install --offline` + `pnpm build`). Uses bash
  #     entrypoint so APP_VERSION (resolved by step 0b) can be passed as
  #     a build-arg via shell expansion.
  - id: build-build-cache
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-deps-cache", "compute-version"]
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        docker build \
          --target=build \
          --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-build \
          --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-deps \
          --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-build \
          --build-arg=BUILDKIT_INLINE_CACHE=1 \
          --build-arg=APP_VERSION="$(cat /workspace/APP_VERSION)" \
          .

  # 1c. Build + push the `prod-deps` stage (production-only node_modules).
  - id: build-prod-deps-cache
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-deps-cache"]
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --target=prod-deps
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-prod-deps
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-deps
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-prod-deps
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .

  # 1. Build the final runner image, tagged with the commit SHA and `latest`.
  #    BuildKit reuses the deps / build / prod-deps stage layers built above.
  #    Bash entrypoint so APP_VERSION can be read from the workspace file
  #    written by step 0b and passed as both a build-arg (bakes into the
  #    bundle) and an extra image tag (e.g. `:v0.3.2`) for `gcloud run
  #    revisions list` clarity.
  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-build-cache", "build-prod-deps-cache"]
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        APP_VERSION="$(cat /workspace/APP_VERSION)"
        # Docker tag chars: [A-Za-z0-9_.-], <=128. git describe output is
        # already safe; the sed below strips a hypothetical `-dirty` (never
        # set on CI's fresh checkout, but cheap insurance).
        IMAGE_TAG="$(echo "$$APP_VERSION" | sed 's/-dirty$//')"
        docker build \
          --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA} \
          --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:$$IMAGE_TAG \
          --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest \
          --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-deps \
          --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-build \
          --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-prod-deps \
          --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest \
          --build-arg=BUILDKIT_INLINE_CACHE=1 \
          --build-arg=APP_VERSION="$$APP_VERSION" \
          .

  # 2. Pre-push gate: scan the just-built client bundle for any literal
  #    secret values pulled from Secret Manager. Blocks `push` + `deploy`
  #    if a server-only secret ever ends up in .output/public/. We reuse
  #    the freshly built image (it already has node + .output) and bind
  #    the secrets in via secretEnv; the scripts dir comes in from the
  #    Cloud Build workspace mount.
  - id: secrets-check
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ["build"]
    secretEnv:
      - DATABASE_URL
      - BETTER_AUTH_SECRET
      - GEMINI_API_KEY
      - RESEND_API_KEY
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
        docker run --rm \
          -v "$$PWD":/workspace \
          -w /app \
          -e BUNDLE_DIR=/app/.output/public \
          -e SECRET_CHECK_KEYS=DATABASE_URL,BETTER_AUTH_SECRET,GEMINI_API_KEY,RESEND_API_KEY \
          -e DATABASE_URL \
          -e BETTER_AUTH_SECRET \
          -e GEMINI_API_KEY \
          -e RESEND_API_KEY \
          --entrypoint node \
          "$$IMAGE" \
          /workspace/scripts/check-secret-leak.mjs

  # Schema management runs at container start, not here. The runner image's
  # entrypoint (`scripts/docker-entrypoint.sh` → `scripts/migrate.mjs`)
  # applies versioned SQL migrations from `./drizzle/` against the live DB
  # before the server binds, recording each one in
  # `drizzle.__drizzle_migrations`. Single source of truth, pinned to the
  # SQL files committed to the repo — schema changes ship via
  # `pnpm db:generate` and the generated `drizzle/NNNN_*.sql` file, not
  # via `drizzle-kit push` inferring from `src/db/schema.ts`.
  #
  # Failure mode if a deploy crashes with `42710 type "..." already exists`
  # (e.g. a DB previously managed with `drizzle-kit push` — empty journal,
  # populated schema): boot once with `BASELINE_MIGRATIONS=1` on the Cloud
  # Run service to mark current journal entries as applied without running
  # their SQL, then clear the flag.

  # 3. Push all tags — both the deployable ones (:SHA and :latest) and the
  #    per-stage cache images (:cache-deps, :cache-build, :cache-prod-deps)
  #    so the next run can rehydrate them via --cache-from.
  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: ["secrets-check"]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

  # 4. Deploy to Cloud Run — but only if the version-gate (step 0c) said yes.
  #    On a gated prod build that didn't win the gate, DEPLOY_GO=no and this
  #    step is a clean no-op (the image is already built + pushed). min=0
  #    (scale to zero) per project decision; session-affinity keeps a given
  #    client on a single instance so the in-memory Automerge Repo stays
  #    consistent for their session. Real-time fan-out across instances would
  #    need a Redis pub/sub (defer until we see multi-instance load).
  #
  #    APP_VERSION is recorded as an env var on the service so the currently
  #    deployed version is visible via `gcloud run services describe`.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    waitFor: ["push", "version-gate"]
    args:
      - -c
      - |
        set -euo pipefail
        if [ "$(cat /workspace/DEPLOY_GO 2>/dev/null || echo no)" != "yes" ]; then
          echo "deploy skipped — version gate did not approve this build for ${_SERVICE}"
          exit 0
        fi
        APP_VERSION="$(cat /workspace/APP_VERSION)"
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --min-instances=0 \
          --max-instances=3 \
          --concurrency=80 \
          --cpu=1 \
          --memory=1Gi \
          --timeout=3600 \
          --session-affinity \
          --set-env-vars=NODE_ENV=production,AUTOMERGE_STORAGE=postgres,BETTER_AUTH_URL=${_BETTER_AUTH_URL},RESEND_FROM_EMAIL=${_RESEND_FROM_EMAIL},APP_VERSION="$$APP_VERSION" \
          --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,BETTER_AUTH_SECRET=${_BETTER_AUTH_SECRET_NAME}:latest,GEMINI_API_KEY=${_GEMINI_API_KEY_SECRET}:latest,RESEND_API_KEY=${_RESEND_API_KEY_SECRET}:latest

# Secret Manager bindings — referenced by step `secretEnv:` lists.
# Each entry exposes the secret value as a normal env var inside the
# step's shell. The Secret Manager entry names are substitution-driven
# so the same YAML can target staging vs prod with distinct secret stores
# (see the header comment for the per-trigger override matrix).
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/${_DATABASE_URL_SECRET}/versions/latest
      env: DATABASE_URL
    - versionName: projects/${PROJECT_ID}/secrets/${_BETTER_AUTH_SECRET_NAME}/versions/latest
      env: BETTER_AUTH_SECRET
    - versionName: projects/${PROJECT_ID}/secrets/${_GEMINI_API_KEY_SECRET}/versions/latest
      env: GEMINI_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/${_RESEND_API_KEY_SECRET}/versions/latest
      env: RESEND_API_KEY
