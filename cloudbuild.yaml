# Cloud Build pipeline triggered on push to `main`.
#
# Builds the Docker image, pushes it to Artifact Registry, and deploys to
# Cloud Run. Secrets (DATABASE_URL, BETTER_AUTH_SECRET, GEMINI_API_KEY,
# etc.) are stored in Secret Manager and mounted as env vars on the
# service — they never appear in the image.
#
# Substitution variables (set on the trigger or via `--substitutions`):
#   _REGION         deploy region, e.g. europe-west1
#   _SERVICE        Cloud Run service name, e.g. pert-li
#   _REPO           Artifact Registry repo, e.g. pert-li
#   _BETTER_AUTH_URL  public URL of the service (https://pert-li-xxx-uc.a.run.app)
#   _RESEND_FROM_EMAIL  sender for magic-link emails; `onboarding@resend.dev`
#                       works for accounts without a verified domain (only
#                       delivers to the API key's owner address).
substitutions:
  _REGION: europe-west1
  _SERVICE: pert-li
  _REPO: pert-li
  _BETTER_AUTH_URL: https://pert-li.example.run.app
  _RESEND_FROM_EMAIL: onboarding@resend.dev

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # 0. Pre-pull cache images for each intermediate stage AND the final
  #    `:latest`. The runner image only ships final-stage layers, so without
  #    per-stage cache images we'd lose hits on the slow `deps` and `build`
  #    stages (pnpm fetch + install + tsc + vite). All best-effort — the
  #    first ever build has nothing to pull.
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        for tag in cache-deps cache-build cache-prod-deps latest; do
          docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:$$tag || true
        done

  # 1a. Build + push the `deps` stage as its own cache image. This is the
  #     stage that runs `pnpm fetch` and is invalidated only when the
  #     lockfile / package.json changes — cache hits here save the most time.
  - id: build-deps-cache
    name: gcr.io/cloud-builders/docker
    waitFor: ["pull-cache"]
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --target=deps
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-deps
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-deps
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .

  # 1b. Build + push the `build` stage. Includes the deps stage + the
  #     compile step (`pnpm install --offline` + `pnpm build`).
  - id: build-build-cache
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-deps-cache"]
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --target=build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-build
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-deps
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-build
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .

  # 1c. Build + push the `prod-deps` stage (production-only node_modules).
  - id: build-prod-deps-cache
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-deps-cache"]
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --target=prod-deps
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-prod-deps
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-deps
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-prod-deps
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .

  # 1. Build the final runner image, tagged with the commit SHA and `latest`.
  #    BuildKit reuses the deps / build / prod-deps stage layers built above.
  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-build-cache", "build-prod-deps-cache"]
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-deps
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-build
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:cache-prod-deps
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .

  # 2. Pre-push gate: scan the just-built client bundle for any literal
  #    secret values pulled from Secret Manager. Blocks `push` + `deploy`
  #    if a server-only secret ever ends up in .output/public/. We reuse
  #    the freshly built image (it already has node + .output) and bind
  #    the secrets in via secretEnv; the scripts dir comes in from the
  #    Cloud Build workspace mount.
  - id: secrets-check
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ["build"]
    secretEnv:
      - DATABASE_URL
      - BETTER_AUTH_SECRET
      - GEMINI_API_KEY
      - RESEND_API_KEY
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
        docker run --rm \
          -v "$$PWD":/workspace \
          -w /app \
          -e BUNDLE_DIR=/app/.output/public \
          -e SECRET_CHECK_KEYS=DATABASE_URL,BETTER_AUTH_SECRET,GEMINI_API_KEY,RESEND_API_KEY \
          -e DATABASE_URL \
          -e BETTER_AUTH_SECRET \
          -e GEMINI_API_KEY \
          -e RESEND_API_KEY \
          --entrypoint node \
          "$$IMAGE" \
          /workspace/scripts/check-secret-leak.mjs

  # Schema management runs at container start, not here. The runner image's
  # entrypoint (`scripts/docker-entrypoint.sh` → `scripts/migrate.mjs`)
  # applies versioned SQL migrations from `./drizzle/` against the live DB
  # before the server binds, recording each one in
  # `drizzle.__drizzle_migrations`. Single source of truth, pinned to the
  # SQL files committed to the repo — schema changes ship via
  # `pnpm db:generate` and the generated `drizzle/NNNN_*.sql` file, not
  # via `drizzle-kit push` inferring from `src/db/schema.ts`.
  #
  # Failure mode if a deploy crashes with `42710 type "..." already exists`
  # (e.g. a DB previously managed with `drizzle-kit push` — empty journal,
  # populated schema): boot once with `BASELINE_MIGRATIONS=1` on the Cloud
  # Run service to mark current journal entries as applied without running
  # their SQL, then clear the flag.

  # 3. Push all tags — both the deployable ones (:SHA and :latest) and the
  #    per-stage cache images (:cache-deps, :cache-build, :cache-prod-deps)
  #    so the next run can rehydrate them via --cache-from.
  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: ["secrets-check"]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

  # 4. Deploy to Cloud Run. min=0 (scale to zero) per project decision;
  #    session-affinity keeps a given client on a single instance so the
  #    in-memory Automerge Repo stays consistent for their session.
  #    Real-time fan-out across instances would need a Redis pub/sub
  #    (defer until we see multi-instance load).
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=0
      - --max-instances=3
      - --concurrency=80
      - --cpu=1
      - --memory=1Gi
      - --timeout=3600
      - --session-affinity
      - --set-env-vars=NODE_ENV=production,AUTOMERGE_STORAGE=postgres,BETTER_AUTH_URL=${_BETTER_AUTH_URL},RESEND_FROM_EMAIL=${_RESEND_FROM_EMAIL}
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,BETTER_AUTH_SECRET=BETTER_AUTH_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,RESEND_API_KEY=RESEND_API_KEY:latest

# Secret Manager bindings — referenced by step `secretEnv:` lists.
# Each entry exposes the secret value as a normal env var inside the
# step's shell. Same secret names the runtime container uses, so the
# leak check scans for exactly the values that would ship.
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
    - versionName: projects/${PROJECT_ID}/secrets/BETTER_AUTH_SECRET/versions/latest
      env: BETTER_AUTH_SECRET
    - versionName: projects/${PROJECT_ID}/secrets/GEMINI_API_KEY/versions/latest
      env: GEMINI_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/RESEND_API_KEY/versions/latest
      env: RESEND_API_KEY
